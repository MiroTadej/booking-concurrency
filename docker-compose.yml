# Disposable PostgreSQL for the test suite. Port 5433 to avoid clashing with a
# local install on 5432. Override with DATABASE_URL if 5460 is taken.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_demo
    ports:
      - "5460:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
